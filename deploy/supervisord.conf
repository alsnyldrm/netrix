[unix_http_server]
file=/tmp/netrix-supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/netrix-supervisord.pid
childlogdir=/tmp
environment=PYTHONUNBUFFERED="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/netrix-supervisor.sock

[program:netrix-redis]
command=redis-server /app/deploy/redis.conf
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:netrix-api]
command=uvicorn netrix.main:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers --forwarded-allow-ips=*
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:netrix-worker]
command=python -m netrix.worker
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:netrix-scheduler]
command=python -m netrix.scheduler
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:netrix-tests]
command=python -m netrix.worker --interactive-tests
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
