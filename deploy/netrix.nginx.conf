server {
    listen 80;
    server_name netrix.fbu.edu.tr;
    return 301 https://netrix.fbu.edu.tr$request_uri;
}
server {
    listen 443 ssl;
    server_name netrix.fbu.edu.tr;
    ssl_certificate /etc/nginx/certs/fbu.edu.tr.crt;
    ssl_certificate_key /etc/nginx/certs/fbu.edu.tr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log off;
    location = /maintenance.html {
        internal;
        root /etc/nginx;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Retry-After "30" always;
    }
    location = /bakim-onizleme {
        alias /etc/nginx/maintenance.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, max-age=0" always;
    }
    location ~ ^/api/v1/firmware/images/[^/]+/content$ {
        client_max_body_size 2g;
        client_body_timeout 3600s;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location = /api/v1/access/avatar {
        client_max_body_size 5m;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
    location / {
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
